name: Compile & Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            icon: icon.png
            suffix: linux
          - os: macos-latest
            icon: icon.png
            suffix: macos
          - os: windows-latest
            icon: icon.ico
            suffix: windows

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller
        pip install -r requirements.txt

    - name: Compile with PyInstaller
      run: pyinstaller --onefile --icon=${{ matrix.icon }} bastetcypher.py

    - name: Build AppImage (Linux only)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update && sudo apt-get install -y squashfs-tools file
        mkdir -p AppDir/usr/bin
        cp dist/bastetcypher AppDir/usr/bin/bastetcypher
        cp icon.png AppDir/bastetcypher.png
        
        echo "[Desktop Entry]" > AppDir/bastetcypher.desktop
        echo "Name=BastetCypher" >> AppDir/bastetcypher.desktop
        echo "Exec=bastetcypher" >> AppDir/bastetcypher.desktop
        echo "Icon=bastetcypher" >> AppDir/bastetcypher.desktop
        echo "Type=Application" >> AppDir/bastetcypher.desktop
        echo "Categories=Utility;" >> AppDir/bastetcypher.desktop
        
        wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/bastetcypher-linux.AppImage
        
        rm dist/bastetcypher

    - name: Rename executables (Windows & Mac)
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv bastetcypher.exe bastetcypher-windows.exe
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv bastetcypher bastetcypher-macos
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bastetcypher-${{ matrix.suffix }}
        path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: bastetcypher-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "BastetCypher - Ultima Versione"
        body: "Compilazione automatica dell'ultimo aggiornamento."
        files: artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
