name: Compile & Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            icon: icon.png
            suffix: linux
          - os: macos-latest
            icon: icon.png
            suffix: macos
          - os: windows-latest
            icon: icon.ico
            suffix: windows

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller
        pip install -r requirements.txt

    - name: Compile with PyInstaller
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
          pyi-makespec --onefile --icon=${{ matrix.icon }} bastetcypher.py
          python3 -c "s = open('bastetcypher.spec').read(); fix = '\nglib_libs = [\"libglib-2.0.so\", \"libgobject-2.0.so\", \"libgio-2.0.so\", \"libgmodule-2.0.so\"]\na.binaries = [x for x in a.binaries if not any(lib in x[0] for lib in glib_libs)]\n'; open('bastetcypher.spec', 'w').write(s.replace('pyz = PYZ', fix + 'pyz = PYZ'))"
          pyinstaller bastetcypher.spec
        else
          pyinstaller --onefile --icon=${{ matrix.icon }} bastetcypher.py
        fi

    - name: Rename executables
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv bastetcypher.exe bastetcypher-windows.exe
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv bastetcypher bastetcypher-macos
        else
          mv bastetcypher bastetcypher-linux
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bastetcypher-${{ matrix.suffix }}
        path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: bastetcypher-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: autopublished
        name: "BastetCypher - Autopublished"
        body: "Automatically populate the latest update."
        files: artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
