name: Compile & Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            suffix: macos
            binary_name: bastetcypher
            target_name: bastetcypher-macos
          - os: windows-latest
            suffix: windows
            binary_name: bastetcypher.exe
            target_name: bastetcypher-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # --noconsole nasconde il prompt nero del terminale
        # --collect-all imageio_ffmpeg include l'eseguibile di ffmpeg dentro il file .exe
        pyinstaller --onefile --noconsole --collect-all imageio_ffmpeg --collect-all pymupdf --icon=icon.ico bastetcypher.py

    - name: Compile with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Se possiedi icon.icns puoi aggiungere: --icon=icon.icns
        pyinstaller --onefile --noconsole --collect-all imageio_ffmpeg --collect-all pymupdf bastetcypher.py

    - name: Prepare and rename executables
      shell: bash
      run: |
        cd dist
        mv "${{ matrix.binary_name }}" "${{ matrix.target_name }}"
        chmod +x "${{ matrix.target_name }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bastetcypher-${{ matrix.suffix }}
        path: dist/${{ matrix.target_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: bastetcypher-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: autopublished
        name: "BastetCipher - Latest Release"
        body: "Automated multi-platform build for Windows and macOS."
        files: artifacts/*
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
