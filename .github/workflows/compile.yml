name: Compile with PyInstaller

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            icon: icon.png
          - os: macos-latest
            icon: icon.png
          - os: windows-latest
            icon: icon.ico

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller
        pip install -r requirements.txt

    - name: Compile with PyInstaller
      run: pyinstaller --onefile --icon=${{ matrix.icon }} bastetcypher.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bastetcypher-${{ matrix.os }}
        path: dist/*
